<div class="uploads-container">
   <app-thumbnail-modal></app-thumbnail-modal>
  <div *ngIf="loading" class="loading">
    Loading uploads...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error" class="uploads-grid">
    <div *ngFor="let upload of uploads" 
         class="upload-card" 
         (click)="onCardClick(upload)">
      
      <div class="thumbnail-container">
        <img 
          *ngIf="upload.defaultThumbnailUrl" 
          [src]="upload.defaultThumbnailUrl" 
          [alt]="upload.originalFilename"
          class="thumbnail"
          (error)="onImageError($event)">
        
        <div class="thumbnail-placeholder" 
             [style.display]="upload.defaultThumbnailUrl ? 'none' : 'flex'">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
      </div>
     

      <div class="card-content">
        <h3 class="video-title">{{ upload.originalFilename }}</h3>
        <div class="video-meta">
          <span class="upload-date">{{ formatDate(upload.createdAt) }}</span>
          <span class="file-size">{{ formatFileSize(upload.size) }}</span>
             <button 
            class="select-thumbnail-btn" 
            (click)="openThumbnailModal(upload.id, $event)"
            title="Select Thumbnail"
          >
          
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21,15 16,10 5,21"></polyline>
            </svg>
            Select Thumbnail
          </button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && !error && uploads.length === 0" class="no-uploads">
    No uploads found
  </div>

  <!-- ✅ Pagination buttons -->
  <div class="pagination-controls" *ngIf=" !error ">
    <button (click)="prevPage()" [disabled]="currentPage === 1">← Prev</button>
    <span>Page {{ currentPage }}</span>
    <button (click)="nextPage()">Next →</button>
  </div>
</div>
